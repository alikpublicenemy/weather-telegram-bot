name: Daily weather and WebUntis timetable

on:
  schedule:
    # Scheduled at 07:07 Europe/Berlin daily; a few minutes past the hour
    # reduces the chance of GitHub's scheduled-run queue being busy.
    - cron: "7 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-weather:
    name: Send daily weather and timetable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send weather to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          WEBUNTIS_ICAL_URL: ${{ secrets.WEBUNTIS_ICAL_URL }}
        run: python send_weather_once.py
